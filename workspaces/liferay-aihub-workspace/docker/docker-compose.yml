name: liferay-aihub

services:
  database:
    image: postgres:16
    container_name: liferay-aihub-db
    environment:
      POSTGRES_DB: lportal
      POSTGRES_USER: liferay
      POSTGRES_PASSWORD: liferay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferay -d lportal"]
      interval: 10s
      timeout: 5s
      retries: 12

  liferay:
    image: ${LIFERAY_IMAGE:-liferay/release-candidates:7.4.13-u151-ai-hub-1783091729}
    container_name: liferay-aihub
    depends_on:
      database:
        condition: service_healthy
    environment:
      LIFERAY_JPDA_ENABLED: "true"
    ports:
      - "8080:8080"
      - "8000:8000"
      - "11311:11311"
    volumes:
      - ./liferay:/mnt/liferay

volumes:
  postgres-data:
