name: liferay-aihub-workspace
services:
    database:
        environment:
            POSTGRES_PASSWORD: liferay
            POSTGRES_USER: liferay
        healthcheck:
            test: >
                pg_isready
                --dbname
                lportal
                --username
                liferay
    liferay:
        environment:
            GOOGLE_APPLICATION_CREDENTIALS: /tmp/keys/adc.json
            LIFERAY_FEATURE_PERIOD_FLAG_PERIOD_UI_PERIOD_VISIBLE_OPENBRACKET_DEV_CLOSEBRACKET_: "true"
            LIFERAY_FEATURE_PERIOD_FLAG_PERIOD__UPPERCASEL__UPPERCASEP__UPPERCASED__MINUS__NUMBER3__NUMBER4__NUMBER5__NUMBER9__NUMBER4_: "true"
            LIFERAY_FEATURE_PERIOD_FLAG_PERIOD__UPPERCASEL__UPPERCASEP__UPPERCASED__MINUS__NUMBER6__NUMBER2__NUMBER2__NUMBER7__NUMBER2_: "true"
            LIFERAY_FEATURE_PERIOD_FLAG_PERIOD__UPPERCASEL__UPPERCASEP__UPPERCASED__MINUS__NUMBER9__NUMBER4__NUMBER9__NUMBER8__NUMBER9_: "true"
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: org.postgresql.Driver
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: liferay
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: jdbc:postgresql://database:5432/lportal
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: liferay
            LIFERAY_JVM_OPTS: -Xms3g -Xmx3g
            LIFERAY_MINIFIER_PERIOD_ENABLED: "false"
            LIFERAY_MINIFIER_PERIOD_INLINE_PERIOD_CONTENT_PERIOD_CACHE_PERIOD_ENABLED: "false"
            LIFERAY_MODULE_PERIOD_FRAMEWORK_PERIOD_PROPERTIES_PERIOD_OSGI_PERIOD_CONSOLE: 0.0.0.0:11311
            LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_CHANGEABLE: "true"
            LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_CHANGE_PERIOD_REQUIRED: "false"
            LIFERAY_RETRY_PERIOD_JDBC_PERIOD_ON_PERIOD_STARTUP_PERIOD_DELAY: "10"
            LIFERAY_RETRY_PERIOD_JDBC_PERIOD_ON_PERIOD_STARTUP_PERIOD_MAX_PERIOD_RETRIES: "2"
            LIFERAY_SESSION_PERIOD_TIMEOUT: "120"
            LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED: "false"
            LIFERAY_TERMS_PERIOD_OF_PERIOD_USE_PERIOD_REQUIRED: "false"
            LIFERAY_THEME_PERIOD_CSS_PERIOD_FAST_PERIOD_LOAD: "false"
            LIFERAY_THEME_PERIOD_IMAGES_PERIOD_FAST_PERIOD_LOAD: "false"
            LIFERAY_WORKSPACE_ENVIRONMENT: !reset null
        image: liferay/release-candidates:7.4.13-u151-ai-hub-1784899461-d10.0.69-snapshot-20260724070222
        ports: !override
            -   8000:8000
            -   8080:8080
            -   11311:11311
        user: 0:0
        volumes: !override
            -   ${GOOGLE_ADC_PATH:-${HOME}/.config/gcloud/application_default_credentials.json}:/tmp/keys/adc.json:ro
            -   ./bundles/data/document_library:/opt/liferay/data/document_library
            -   ./bundles/logs:/opt/liferay/logs
            -   ./bundles/osgi/client-extensions:/opt/liferay/osgi/client-extensions
            -   ./bundles/osgi/modules:/mnt/liferay/deploy
            -   ./configs/docker:/mnt/liferay/files